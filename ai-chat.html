<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>বিরাটি ঠেক AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI','Noto Sans Bengali',sans-serif;background:#fdf8f0;min-height:100vh;}

  /* ══ SELECTOR ══════════════════════════════════════════════ */
  #selector{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 3rem;overflow-y:auto;}

  .logo{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;font-size:1.9rem;margin:0 auto 0.75rem;box-shadow:0 4px 16px rgba(217,119,6,0.3);}
  .title{color:#92400e;font-size:1.8rem;font-weight:700;text-align:center;}
  .subtitle{color:#6b4e28;font-size:0.82rem;font-weight:700;text-align:center;margin-top:0.3rem;}

  /* top row: feedback left, dashboard right */
  .top-row{display:flex;gap:1rem;max-width:860px;width:100%;margin-top:1.5rem;align-items:flex-start;}

  /* feedback card */
  .fb-card{background:#fff;border:1.5px solid #e8ddc8;border-radius:16px;padding:1rem 1.1rem;flex:1;box-shadow:0 2px 12px rgba(0,0,0,0.05);}
  .fb-card-title{color:#92400e;font-size:0.78rem;font-weight:700;margin-bottom:0.6rem;text-transform:uppercase;letter-spacing:0.6px;}
  .fb-textarea{width:100%;background:#fdf8f0;border:1.5px solid #e0d0b8;border-radius:10px;padding:0.5rem 0.75rem;font-size:0.78rem;color:#3d2b0a;font-family:'Segoe UI','Noto Sans Bengali',sans-serif;resize:none;height:72px;}
  .fb-textarea:focus{outline:none;border-color:#c8860a;}
  .fb-textarea::placeholder{color:#8a6a3a;font-weight:600;}
  .fb-submit{margin-top:0.5rem;background:linear-gradient(135deg,#f59e0b,#d97706);border:none;border-radius:24px;padding:0.4rem 1rem;color:#fff;font-weight:700;font-size:0.75rem;cursor:pointer;width:100%;transition:opacity 0.15s;}
  .fb-submit:hover{opacity:0.88;}

  /* dashboard card */
  .dash-card{background:#fff;border:1.5px solid #e8ddc8;border-radius:16px;padding:1rem 1.1rem;flex:1;box-shadow:0 2px 12px rgba(0,0,0,0.05);}
  .dash-card-title{color:#92400e;font-size:0.78rem;font-weight:700;margin-bottom:0.6rem;text-transform:uppercase;letter-spacing:0.6px;}
  .dash-stat{display:flex;justify-content:space-between;align-items:center;padding:0.25rem 0;border-bottom:1px solid #f0e8d8;}
  .dash-stat:last-child{border-bottom:none;}
  .dash-label{color:#6b4e28;font-size:0.75rem;font-weight:700;}
  .dash-val{color:#92400e;font-size:0.85rem;font-weight:700;}
  .lb-row{display:flex;align-items:center;gap:0.5rem;padding:0.2rem 0;}
  .lb-rank{font-size:0.9rem;width:20px;flex-shrink:0;}
  .lb-emoji{font-size:1rem;flex-shrink:0;}
  .lb-name{color:#3d2b0a;font-size:0.72rem;font-weight:700;flex:1;}
  .lb-bar-wrap{width:50px;background:#f0e8d8;border-radius:99px;height:5px;flex-shrink:0;}
  .lb-bar{background:linear-gradient(90deg,#f59e0b,#d97706);border-radius:99px;height:5px;}
  .lb-num{color:#92400e;font-size:0.7rem;font-weight:700;min-width:20px;text-align:right;}
  .lb-empty{color:#8a6a3a;font-size:0.75rem;font-weight:600;text-align:center;padding:0.5rem 0;}

  /* member grid card */
  .member-card{background:#fff;border:1.5px solid #e8ddc8;border-radius:20px;padding:1.5rem;max-width:860px;width:100%;box-shadow:0 2px 20px rgba(0,0,0,0.06);margin-top:1rem;}
  .card-label{color:#6b4e28;font-size:0.78rem;text-align:center;margin-bottom:1rem;text-transform:uppercase;letter-spacing:0.8px;font-weight:700;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0.7rem;}

  .member-btn{background:#fff;border:1.5px solid #e8ddc8;border-radius:14px;padding:0.7rem 0.4rem 0.6rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0.25rem;transition:all 0.18s;position:relative;overflow:hidden;}
  .member-btn:hover{border-color:#c8860a;background:#fffaf0;transform:translateY(-2px);box-shadow:0 4px 12px rgba(200,134,10,0.15);}
  .member-thumb{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid #e8ddc8;margin-bottom:0.2rem;background:#f5f0e8;}
  .member-thumb-fallback{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:#fdf8f0;border:2px solid #e8ddc8;margin-bottom:0.2rem;}
  .m-name{color:#3d2b0a;font-size:0.7rem;font-weight:700;}
  .m-nick{color:#6b4e28;font-size:0.58rem;line-height:1.3;font-weight:700;}
  .msg-badge{position:absolute;top:5px;right:5px;background:#f59e0b;color:#fff;font-size:0.52rem;font-weight:700;border-radius:99px;padding:1px 5px;min-width:16px;text-align:center;}

  .footer-text{color:#6b4e28;font-size:0.76rem;font-weight:700;margin-top:1.2rem;}

  /* ══ CHAT ══════════════════════════════════════════════════ */
  #chat{height:100vh;display:none;flex-direction:column;background:#f5f0e8;}
  .header{background:#fff;border-bottom:1.5px solid #e8ddc8;padding:0.6rem 1rem;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 8px rgba(0,0,0,0.05);flex-shrink:0;}
  .header-left{display:flex;align-items:center;gap:0.65rem;}
  .h-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;font-size:1.15rem;box-shadow:0 2px 8px rgba(217,119,6,0.25);flex-shrink:0;}
  .header-title{color:#92400e;font-weight:700;font-size:0.9rem;}
  .header-sub{color:#6b4e28;font-size:0.66rem;font-weight:700;display:flex;align-items:center;gap:5px;}
  .online-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#22c55e;}
  .home-btn{background:rgba(255,255,255,0.7);border:1.5px solid #e0d0b8;border-radius:10px;padding:0.35rem 0.9rem;font-size:0.76rem;cursor:pointer;color:#6b4e28;font-weight:700;transition:all 0.15s;}
  .home-btn:hover{background:#fff;border-color:#c8860a;color:#92400e;}

  #dash-strip{background:#fffaf0;border-bottom:1px solid #e8ddc8;padding:0.3rem 1rem;font-size:0.72rem;color:#6b4e28;font-weight:700;flex-shrink:0;}

  .messages{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:0.8rem;}
  .messages::-webkit-scrollbar{width:4px;}
  .messages::-webkit-scrollbar-thumb{background:#d4c4a8;border-radius:4px;}

  .welcome{text-align:center;padding:3rem 1rem;}
  .welcome .w-emoji{font-size:2.5rem;margin-bottom:0.75rem;}
  .welcome .w-name{color:#6b4e28;font-size:0.95rem;font-weight:700;margin-bottom:0.4rem;}
  .welcome .w-name span{color:#92400e;}
  .welcome .w-hint{color:#6b4e28;font-size:0.82rem;font-weight:700;line-height:1.6;}

  .msg-row{display:flex;align-items:flex-end;gap:0.4rem;animation:fadeUp 0.22s ease;}
  .msg-row.user{justify-content:flex-end;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

  .msg-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.95rem;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,0.12);}
  .ai-av{background:linear-gradient(135deg,#f59e0b,#d97706)!important;box-shadow:0 2px 6px rgba(217,119,6,0.2)!important;}

  .bubble{max-width:72%;padding:0.65rem 0.95rem;font-size:0.88rem;line-height:1.65;white-space:pre-wrap;word-break:break-word;}
  .ai-bubble{border-radius:4px 18px 18px 18px;background:#fff;border:1.5px solid #e8ddc8;color:#3d2b0a;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
  .user-bubble{border-radius:18px 18px 4px 18px;background:#92400e;color:#fdf8f0;box-shadow:0 2px 8px rgba(146,64,14,0.2);}

  .typing{display:flex;align-items:flex-end;gap:0.4rem;animation:fadeUp 0.22s ease;}
  .dots{display:flex;gap:4px;padding:0.65rem 1rem;background:#fff;border:1.5px solid #e8ddc8;border-radius:4px 18px 18px 18px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
  .dot{width:7px;height:7px;border-radius:50%;background:#d97706;animation:dot 1.1s infinite;}
  .dot:nth-child(2){animation-delay:0.22s}.dot:nth-child(3){animation-delay:0.44s}
  @keyframes dot{0%,80%,100%{transform:translateY(0);opacity:0.4}40%{transform:translateY(-4px);opacity:1}}

  /* bottom area */
  .bottom-wrap{background:#fff;border-top:1.5px solid #e8ddc8;flex-shrink:0;box-shadow:0 -1px 8px rgba(0,0,0,0.04);}
  .input-bar{padding:0.7rem 1rem 0.4rem;display:flex;gap:0.6rem;align-items:center;}
  .chat-input{flex:1;background:#fdf8f0;border:1.5px solid #e0d0b8;border-radius:24px;padding:0.6rem 1rem;color:#3d2b0a;font-size:0.88rem;font-family:'Segoe UI','Noto Sans Bengali',sans-serif;transition:border-color 0.15s;}
  .chat-input:focus{outline:none;border-color:#c8860a;}
  .chat-input::placeholder{color:#8a6a3a;font-weight:600;}
  .send-btn{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#d97706);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;box-shadow:0 2px 8px rgba(217,119,6,0.3);transition:all 0.15s;}
  .send-btn:hover:not(:disabled){opacity:0.88;transform:scale(1.05)}.send-btn:disabled{opacity:0.4;cursor:not-allowed;}
  /* spacer so input is not at very bottom */
  .input-spacer{height:14px;}

  /* ══ MODAL ══════════════════════════════════════════════════ */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;display:none;align-items:center;justify-content:center;padding:1rem;}
  .modal-overlay.open{display:flex;}
  .modal{background:#fff;border-radius:20px;padding:1.5rem;max-width:380px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.15);animation:fadeUp 0.2s ease;text-align:center;}
  .modal .s-emoji{font-size:2.5rem;margin-bottom:0.5rem;}
  .modal .s-text{color:#92400e;font-weight:700;font-size:0.95rem;}
  .modal .s-sub{color:#6b4e28;font-size:0.78rem;font-weight:700;margin-top:0.3rem;}
  .modal-ok{margin-top:1rem;background:linear-gradient(135deg,#f59e0b,#d97706);border:none;border-radius:24px;padding:0.5rem 1.5rem;color:#fff;font-weight:700;cursor:pointer;font-size:0.85rem;}

  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#3d2b0a;color:#fdf8f0;padding:0.5rem 1.2rem;border-radius:24px;font-size:0.82rem;z-index:999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.2);display:none;}
</style>
</head>

    <div class="input-spacer"></div>

</div>

const MEM_KEY      = "birati_mem_v3";
const STATS_KEY    = "birati_stats_v1";
const FEEDBACK_KEY = "birati_feedback_v1";

let selectedMember = null;
let messages       = [];
let memories       = [];

// ── STATS ──────────────────────────────────────────────────────
function loadStats(){ try{return JSON.parse(localStorage.getItem(STATS_KEY))||{visits:0,msgs:{},total:0};}catch{return{visits:0,msgs:{},total:0};} }
function saveStats(s){ localStorage.setItem(STATS_KEY,JSON.stringify(s)); }

function updateDash(){
  const s=loadStats();
  const top=Object.entries(s.msgs).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([n,c])=>`${n}(${c})`).join(" · ");
  document.getElementById("dash-strip").innerHTML=
    `👥 Visit: <b>${s.visits}</b> &nbsp;·&nbsp; 💬 Message: <b>${s.total}</b>`+(top?` &nbsp;·&nbsp; 🏆 ${top}`:"");
}

function renderHomeDash(){
  const s=loadStats();
  const statsEl=document.getElementById("home-dash-stats");
  statsEl.innerHTML=`
    <div class="dash-stat"><span class="dash-label">👥 মোট visit</span><span class="dash-val">${s.visits}</span></div>
    <div class="dash-stat"><span class="dash-label">💬 মোট message</span><span class="dash-val">${s.total}</span></div>`;

  const entries=Object.entries(s.msgs).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const lb=document.getElementById("home-lb");
  if(entries.length===0){lb.innerHTML='<div class="lb-empty">এখনো কেউ message করেনি!</div>';return;}
  const max=entries[0][1]||1;
  const medals=["🥇","🥈","🥉","4️⃣","5️⃣"];
  lb.innerHTML="";
  entries.forEach(([nick,count],i)=>{
    const m=MEMBERS.find(x=>x.nick===nick)||{emoji:"👤"};
    const pct=Math.round((count/max)*100);
    const row=document.createElement("div");
    row.className="lb-row";
    row.innerHTML=`<div class="lb-rank">${medals[i]||""}</div><div class="lb-emoji">${m.emoji}</div><div class="lb-name">${m.name||nick}</div><div class="lb-bar-wrap"><div class="lb-bar" style="width:${pct}%"></div></div><div class="lb-num">${count}</div>`;
    lb.appendChild(row);
  });
}

// ── MEMORY ──────────────────────────────────────────────────────
function loadMem(){ try{memories=JSON.parse(localStorage.getItem(MEM_KEY))||[];}catch{memories=[];} }
function saveMem(){ localStorage.setItem(MEM_KEY,JSON.stringify(memories.slice(-40))); }

async function extractMemory(userMsg,aiReply,member){ return; // disabled
  await new Promise(r=>setTimeout(r,20000));
  try{
    const prompt = "Memory extractor। এই conversation থেকে বিরাটি ঠেক গ্রুপ সম্পর্কে নতুন specific তথ্য থাকলে extract করো। Max 2 items। Return ONLY JSON array of Bengali strings। নতুন কিছু না থাকলে return []. User(" + member.nick + "):" + userMsg + " AI:" + aiReply;
    const res=await fetch(GEMINI_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        system_instruction:{parts:[{text:"You are a memory extractor. Return only a JSON array."}]},
        contents:[{role:"user",parts:[{text:prompt}]}],
        generationConfig:{maxOutputTokens:150}
      })
    });
    const d=await res.json();
    if(d.error)return;
    const raw=d.candidates?.[0]?.content?.parts?.[0]?.text||"[]";
    const items=JSON.parse(raw.replace(/```json|```/g,"").trim());
    if(!Array.isArray(items)||items.length===0)return;
    const ts=new Date().toLocaleDateString("bn-BD",{day:"numeric",month:"short"});
    items.forEach(t=>memories.push({text:String(t).slice(0,150),by:member.nick,ts}));
    saveMem();
  }catch{}
}

// ── FEEDBACK ────────────────────────────────────────────────────
function submitHomeFeedback(){
  const input=document.getElementById("home-fb-input");
  const text=input.value.trim();
  if(!text){showToast("কিছু লেখো আগে!"); return;}
  try{
    const all=JSON.parse(localStorage.getItem(FEEDBACK_KEY)||"[]");
    all.push({member:"Home",nick:"Homepage",text,ts:new Date().toISOString(),msgs:0});
    localStorage.setItem(FEEDBACK_KEY,JSON.stringify(all));
  }catch{}
  input.value="";
  document.getElementById("fb-modal-msg").innerHTML="তোমার feedback save হয়েছে।<br>Debanjan-দা পরে দেখবেন। 🙏";
  document.getElementById("fb-modal").classList.add("open");
}

document.getElementById("fb-modal").addEventListener("click",function(e){ if(e.target===this)this.classList.remove("open"); });

// ── BUILD GRID ──────────────────────────────────────────────────
function buildGrid(){
  const grid=document.getElementById("member-grid");
  const s=loadStats();
  MEMBERS.forEach(m=>{
    const btn=document.createElement("button");
    btn.className="member-btn";
    const cnt=s.msgs[m.nick]||0;
    const badge=cnt>0?`<span class="msg-badge">${cnt}</span>`:"";
    const thumb=m.img
      ?`<img class="member-thumb" src="${BASE_URL}${m.img}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" alt="${m.name}"><div class="member-thumb-fallback" style="display:none">${m.emoji}</div>`
      :`<div class="member-thumb-fallback">${m.emoji}</div>`;
    btn.innerHTML=`${badge}${thumb}<span class="m-name">${m.name}</span><span class="m-nick">${m.nick}</span>`;
    btn.onclick=()=>selectMember(m);
    grid.appendChild(btn);
  });
}

// ── NAVIGATION ──────────────────────────────────────────────────
function selectMember(m){
  selectedMember=m; messages=[];
  document.getElementById("selector").style.display="none";
  document.getElementById("chat").style.display="flex";
  document.getElementById("member-label").textContent=`${m.emoji} ${m.nick} কথা বলছেন`;
  document.getElementById("chat-input").placeholder=`${m.nick} — কিছু বলো...`;
  document.getElementById("messages").innerHTML=`<div class="welcome"><div class="w-emoji">${m.emoji}</div><div class="w-name">নমস্কার, <span>${m.nick}</span>!</div><div class="w-hint">গ্রুপের গল্প, রাজনীতি, পুরনো কাণ্ড — যা খুশি জিজ্ঞেস করো।</div></div>`;
  updateDash();
  document.getElementById("chat-input").focus();
}

function goBack(){
  selectedMember=null; messages=[];
  document.getElementById("chat").style.display="none";
  document.getElementById("selector").style.display="flex";
  renderHomeDash();
  buildGridBadges();
}

function buildGridBadges(){
  const s=loadStats();
  document.querySelectorAll(".member-btn").forEach(btn=>{
    const nick=btn.querySelector(".m-nick")?.textContent;
    const cnt=s.msgs[nick]||0;
    let badge=btn.querySelector(".msg-badge");
    if(cnt>0){
      if(!badge){badge=document.createElement("span");badge.className="msg-badge";btn.appendChild(badge);}
      badge.textContent=cnt;
    }
  });
}

// ── TOAST ────────────────────────────────────────────────────────
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.style.display="block";
  setTimeout(()=>t.style.display="none",2500);
}

// ── SEND ─────────────────────────────────────────────────────────
// ── Gemini Direct Call ───────────────────────────────────────
async function geminiDirect(messages, member) {
  const sysLines = [SYSTEM_PROMPT];
  if(memories.length > 0){
    sysLines.push("\n== নতুন শেখা ==");
    memories.slice(-20).forEach(m => sysLines.push("- [" + m.ts + "," + m.by + "]: " + m.text));
  }
  sysLines.push("\nএখন কথা বলছেন: " + member.name + " (nickname: " + member.nick + ")। nickname ধরে ডাকো। সবসময় বাংলায়।");
  const res = await fetch(GEMINI_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      system_instruction:{parts:[{text: sysLines.join("\n")}]},
      contents: messages,
      generationConfig:{maxOutputTokens:300}
    })
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message);
  return data.candidates?.[0]?.content?.parts?.[0]?.text || "কিছু বুঝলাম না! আবার বলো।";
}

async function sendMessage(){
  const input=document.getElementById("chat-input");
  const text=input.value.trim();
  if(!text||!selectedMember)return;
  input.value="";
  document.querySelector(".welcome")?.remove();

  const s=loadStats(); s.total++; s.msgs[selectedMember.nick]=(s.msgs[selectedMember.nick]||0)+1; saveStats(s); updateDash();

  appendMsg("user",text,selectedMember);
  messages.push({role:"user",parts:[{text}]});
  showTyping();
  document.getElementById("send-btn").disabled=true;

  try{
    let aiText;
    const userText = messages[messages.length-1]?.parts?.[0]?.text || "";

    try{
      if(needsWebSearch(userText)){
        // ── Web search দরকার → Netlify function ──────────────
        const res = await fetch(NETLIFY_URL, {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            messages,
            memberName:selectedMember.name,
            memberNick:selectedMember.nick
          })
        });
        const data = await res.json();
        if(res.status===429 || data.error){
          // Search fail → graceful fallback to Gemini direct
          aiText = await geminiDirect(messages, selectedMember);
        } else {
          aiText = data.text || "কিছু বুঝলাম না! আবার বলো।";
        }
      } else {
        // ── Thek context → Gemini direct (no rate limit issue) ──
        aiText = await geminiDirect(messages, selectedMember);
      }
    }catch(e){
      aiText = "নেটওয়ার্ক সমস্যা! একটু পরে চেষ্টা করো। 🙏";
    }
    removeTyping();
    appendMsg("ai",aiText,null);
    messages.push({role:"model",parts:[{text:aiText}]});

  }catch{
    removeTyping();
    appendMsg("ai","নেটওয়ার্ক সমস্যা! একটু পরে চেষ্টা করো। 🙏",null);
  }finally{
    document.getElementById("send-btn").disabled=false;
    input.focus();
  }
}

// ── DOM HELPERS ──────────────────────────────────────────────────
function appendMsg(type,text,member){
  const msgs=document.getElementById("messages");
  const row=document.createElement("div");
  row.className="msg-row "+(type==="user"?"user":"");
  if(type==="ai"){
    row.innerHTML=`<div class="msg-avatar ai-av">🤖</div><div class="bubble ai-bubble">${esc(text)}</div>`;
  }else{
    row.innerHTML=`<div class="bubble user-bubble">${esc(text)}</div><div class="msg-avatar" style="background:${member.color}">${member.emoji}</div>`;
  }
  msgs.appendChild(row);
  msgs.scrollTop=msgs.scrollHeight;
}
function showTyping(){
  const msgs=document.getElementById("messages");
  const t=document.createElement("div");
  t.className="typing";t.id="typing";
  t.innerHTML=`<div class="msg-avatar ai-av">🤖</div><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  msgs.appendChild(t);msgs.scrollTop=msgs.scrollHeight;
}
function removeTyping(){document.getElementById("typing")?.remove();}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");}

// ── EVENT LISTENERS ──────────────────────────────────────────────
document.getElementById("chat-input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}});
document.getElementById("chat-input").addEventListener("paste",e=>{
  for(let i of(e.clipboardData?.items||[])){
    if(i.type.startsWith("image/")||i.kind==="file"){e.preventDefault();showToast("⛔ ছবি বা ফাইল পাঠানো যাবে না!");return;}
  }
});

// ── INIT ─────────────────────────────────────────────────────────
loadMem();
buildGrid();
renderHomeDash();
const st=loadStats();st.visits++;saveStats(st);
